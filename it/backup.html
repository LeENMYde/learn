<body>
  <div id="seitenkopf" data-wurzel="../"></div>

  <main class="seite" data-rechner data-merken></main>

  <div id="seitenfuss" data-wurzel="../"></div>

  <script src="../assets/katex/katex.min.js"></script>
  <script src="../assets/rechner.js"></script>
  <script>
  (function () {
    'use strict';
    const bewegungAus = false;
    const R = Rechner, z = R.zahl, tz = R.tz, E = R.E;
    const BEISPIEL = { daten: 4, aenderung: 3, wachstum: 20, strategie: 'inkr', voll: 7, aufbewahrung: 30, faktor: 1.6, rate: 200, restore: 250, offsite: 100, intervall: 24, kopien: 3, medien: 2, extern: 'ja', offline: 'ja', test: 'quartal' };

    R.seite({
      titel: 'Backup-Planer',
      einleitung: 'Datensicherung planen: Speicherbedarf mit Voll-, inkrementeller oder differenzieller Sicherung über die Aufbewahrungszeit, Dauer der Sicherung und der Wiederherstellung, Übertragung außer Haus, Datenverlust im schlimmsten Fall (RPO) und Prüfung nach der 3-2-1-1-0-Regel.',
      hilfe: 'Änderungsrate = Anteil der Daten, der sich pro Tag ändert (typisch 1–5 %). Faktor = Ersparnis durch Kompression und Deduplizierung (1 = keine).',
      gruppen: [
        { titel: 'Daten', farbe: '#3B5BDB', felder: [
          { k: 'daten', tex: 'D', name: 'Datenmenge heute', e: 'TB', min: 0.001, max: 100000 },
          { k: 'aenderung', tex: 'a', name: 'Änderung je Tag', e: '%', min: 0, max: 100 },
          { k: 'wachstum', tex: 'g', name: 'Wachstum im Jahr', e: '%', min: 0, max: 500 },
          { k: 'faktor', tex: 'k', name: 'Kompression / Deduplizierung', e: '×', min: 1, max: 50 }
        ] },
        { titel: 'Verfahren', farbe: '#0E6B6A', felder: [
          { k: 'strategie', name: 'Sicherungsart', wahl: [['voll', 'nur Vollsicherungen'], ['inkr', 'Voll + inkrementell'], ['diff', 'Voll + differenziell']] },
          { k: 'voll', tex: 'T_\\text{Voll}', name: 'Vollsicherung alle', e: 'Tage', min: 1, max: 365, ganz: true, wenn: function (e) { return e.strategie !== 'voll'; } },
          { k: 'intervall', tex: 'T', name: 'Sicherung alle', e: 'h', min: 0.25, max: 720 },
          { k: 'aufbewahrung', tex: 'T_\\text{auf}', name: 'Aufbewahrung', e: 'Tage', min: 1, max: 3650, ganz: true }
        ] },
        { titel: 'Geschwindigkeit', farbe: '#B5533C', felder: [
          { k: 'rate', tex: 'v_\\text{Backup}', name: 'Sicherung zum Ziel', e: 'MB/s', min: 0.1, max: 100000 },
          { k: 'restore', tex: 'v_\\text{Restore}', name: 'Wiederherstellung', e: 'MB/s', min: 0.1, max: 100000 },
          { k: 'offsite', tex: 'v_\\text{extern}', name: 'Leitung außer Haus', e: 'Mbit/s', min: 0.1, max: 100000 }
        ] },
        { titel: '3-2-1-1-0', farbe: '#6E6FA6', felder: [
          { k: 'kopien', tex: 'n', name: 'Kopien der Daten (mit Original)', e: '', min: 1, max: 10, ganz: true },
          { k: 'medien', name: 'verschiedene Speichermedien', e: '', min: 1, max: 5, ganz: true },
          { k: 'extern', name: 'eine Kopie außer Haus', wahl: [['ja', 'ja'], ['nein', 'nein']] },
          { k: 'offline', name: 'eine Kopie offline / unveränderlich', wahl: [['ja', 'ja'], ['nein', 'nein']] },
          { k: 'test', name: 'Wiederherstellung geprüft', wahl: [['monat', 'monatlich'], ['quartal', 'vierteljährlich'], ['jahr', 'jährlich'], ['nie', 'nie']] }
        ] }
      ],
      beispiel: BEISPIEL,
      rechne: rechne, ergebnis: ergebnis, weg: weg,
      sammlung: [
        ['Inkrementell', 'S_\\text{inkr} = D \\cdot a', 'nur Änderungen seit der letzten Sicherung; Wiederherstellen braucht Voll + alle Inkremente'],
        ['Differenziell', 'S_\\text{diff}(k) = D \\cdot \\left(1 - (1 - a)^k\\right)', 'Änderungen seit der letzten Vollsicherung; Wiederherstellen braucht Voll + letztes Differenzial'],
        ['Speicherbedarf', 'S = \\frac{1}{k} \\sum_{\\text{Aufbewahrung} + T_\\text{Voll}} S_\\text{Tag}', 'eine Kette mehr, weil ältere Inkremente ihre Vollsicherung brauchen'],
        ['Dauer', 't = \\frac{S}{v}', 'Sicherungsfenster und Wiederherstellungszeit (RTO)'],
        ['RPO', 'RPO = T', 'im schlimmsten Fall gehen die Änderungen seit der letzten Sicherung verloren'],
        ['3-2-1-1-0', '3\\ \\text{Kopien},\\ 2\\ \\text{Medien},\\ 1\\ \\text{außer Haus},\\ 1\\ \\text{offline},\\ 0\\ \\text{Fehler}', 'die letzte Null: Wiederherstellung regelmäßig geprüft, ohne Fehler']
      ],
      quellen: 'BSI IT-Grundschutz-Kompendium CON.3 (Datensicherungskonzept), BSI OPS.1.2.2 (Archivierung), 3-2-1-Regel nach gängiger Praxis. Änderungsraten und Deduplizierungsfaktoren schwanken stark je nach Daten.',
      bild: { titel: 'Sicherungen über die Zeit', label: 'Balken je Tag: Voll-, inkrementelle und differenzielle Sicherungen, Aufbewahrungsfenster und Wiederherstellungskette', animiert: !bewegungAus,
        hoehe: function (B) { return Math.max(230, Math.min(300, B * 0.48)); }, zeichne: zeichne,
        hinweis: function (r, e) { return 'Rot umrandet: was für eine Wiederherstellung des neuesten Stands gelesen werden muss (' + z(r.kette * 1000, 0) + ' GB).'; } }
    });

    function stunden(h) { if (!isFinite(h)) return '–'; if (h < 1) return z(h * 60, 0) + ' min'; if (h < 48) return z(h, 1) + ' h'; return z(h / 24, 1) + ' Tage'; }
    function jobGroesse(e, d) {
      const T = e.strategie === 'voll' ? 1 : e.voll, k = d % T;
      if (k === 0 || e.strategie === 'voll') return [e.daten, 'v'];
      if (e.strategie === 'inkr') return [e.daten * e.aenderung / 100, 'i'];
      return [e.daten * (1 - Math.pow(1 - e.aenderung / 100, k)), 'd'];
    }
    function rechne(e) {
      const r = {};
      const T = e.strategie === 'voll' ? 1 : e.voll;
      const tage = Math.min(4000, e.aufbewahrung + T);
      let summe = 0, nVoll = 0;
      for (let d = 0; d < tage; d++) { const j = jobGroesse(e, d); summe += j[0]; if (j[1] === 'v') nVoll++; }
      // je Sicherung (bei mehreren pro Tag teilt sich die Tagesänderung auf)
      r.jeTag = 24 / e.intervall;
      r.speicher = summe / e.faktor;
      r.speicherJahr = r.speicher * (1 + e.wachstum / 100);
      r.nVoll = nVoll;
      r.tVoll = e.daten * 1e6 / e.rate / 3600;
      r.tKlein = e.strategie === 'voll' ? r.tVoll : e.daten * e.aenderung / 100 / r.jeTag * 1e6 / e.rate / 3600;
      // Wiederherstellung des neuesten Stands am Ende einer Kette
      if (e.strategie === 'voll') r.kette = e.daten;
      else if (e.strategie === 'inkr') r.kette = e.daten + (T - 1) * e.daten * e.aenderung / 100;
      else r.kette = e.daten + e.daten * (1 - Math.pow(1 - e.aenderung / 100, T - 1));
      r.tRestore = e.daten * 1e6 / e.restore / 3600 + (r.kette - e.daten) * 1e6 / e.restore / 3600 * 1.3;
      r.kettenLaenge = e.strategie === 'inkr' ? T : e.strategie === 'diff' ? Math.min(2, T) : 1;
      r.offTag = (e.strategie === 'voll' ? e.daten : (e.daten / T + e.daten * e.aenderung / 100 * (T - 1) / T)) / e.faktor;
      r.tOff = r.offTag * 8e6 / e.offsite / 3600;
      r.tOffVoll = e.daten / e.faktor * 8e6 / e.offsite / 3600;
      r.regeln = [e.kopien >= 3, e.medien >= 2, e.extern === 'ja', e.offline === 'ja', e.test !== 'nie' && e.test !== 'jahr'];
      r.erfuellt = r.regeln.filter(Boolean).length;
      return r;
    }
    function ergebnis(r, e, H) {
      if (r.tVoll > e.intervall && e.strategie === 'voll') H.meldung('Eine Vollsicherung dauert ' + stunden(r.tVoll) + ' – länger als das Intervall von ' + stunden(e.intervall) + '. Inkrementell sichern oder schneller.', true);
      else if (r.tVoll > 12) H.meldung('Die Vollsicherung braucht ' + stunden(r.tVoll) + ' – passt sie ins nächtliche Fenster? Sonst synthetische Vollsicherungen oder Snapshots nutzen.');
      if (r.tOff > 24 * e.intervall / 24 && r.tOff > e.intervall) H.meldung('Die Kopie außer Haus schafft die Leitung nicht: ' + stunden(r.tOff) + ' je Tag. Erste Kopie per Datenträger (Seeding), dann nur Änderungen.', true);
      if (e.strategie === 'inkr' && e.voll > 14) H.meldung('Lange Inkrement-Ketten (' + e.voll + ' Glieder) machen die Wiederherstellung langsam und anfällig: Ist ein Glied defekt, fehlt alles danach.');
      if (e.offline === 'nein') H.meldung('Ohne Offline- oder unveränderliche Kopie kann ein Verschlüsselungstrojaner auch die Sicherungen zerstören.', true);
      if (e.test === 'nie') H.meldung('Nie getestete Sicherungen sind keine Sicherungen. Wiederherstellung regelmäßig ausprobieren und dokumentieren.', true);
      H.urteil(r.erfuellt === 5, r.erfuellt + ' von 5 Regeln erfüllt');
      H.kacheln([
        [z(r.speicher, 2) + ' TB', 'Speicherbedarf (' + z(r.speicherJahr, 2) + ' TB in einem Jahr)', '#3B5BDB'],
        [stunden(r.tVoll), 'Dauer einer Vollsicherung', '#0E6B6A'],
        [stunden(r.tKlein), e.strategie === 'voll' ? 'je Sicherung' : 'je ' + (e.strategie === 'inkr' ? 'inkrementeller' : 'differenzieller') + ' Sicherung', '#2B7BB9'],
        [stunden(r.tRestore), 'Wiederherstellung neuester Stand (RTO)', '#E4572E'],
        [stunden(e.intervall), 'Datenverlust höchstens (RPO)', '#B5533C'],
        [stunden(r.tOff), 'Übertragung außer Haus je Tag (erste Kopie ' + stunden(r.tOffVoll) + ')', '#6E6FA6']
      ]);
      H.nachweise([
        [r.regeln[0], '3 Kopien', e.kopien + ' Kopien der Daten'],
        [r.regeln[1], '2 verschiedene Medien', e.medien + ' Medientypen (z. B. Platte und Band oder Cloud)'],
        [r.regeln[2], '1 Kopie außer Haus', e.extern === 'ja' ? 'vorhanden' : 'fehlt – Brand oder Diebstahl treffen sonst alles'],
        [r.regeln[3], '1 Kopie offline oder unveränderlich', e.offline === 'ja' ? 'vorhanden' : 'fehlt'],
        [r.regeln[4], '0 Fehler bei der Wiederherstellung', { monat: 'monatlich geprüft', quartal: 'vierteljährlich geprüft', jahr: 'nur jährlich – zu selten', nie: 'nie geprüft' }[e.test]]
      ]);
    }
    function weg(r, e) {
      const T = e.strategie === 'voll' ? 1 : e.voll;
      return [
        ['Tägliche Änderung', 'D \\cdot a = ' + tz(e.daten, 2) + ' \\cdot ' + tz(e.aenderung / 100, 3) + ' = ' + tz(e.daten * e.aenderung / 100 * 1000, 0) + '\\,\\text{GB}'],
        ['Speicherbedarf', 'S = \\frac{1}{' + tz(e.faktor, 1) + '} \\sum_{' + (e.aufbewahrung + T) + '\\,\\text{Tage}} S_\\text{Tag} = ' + E(tz(r.speicher, 2) + '\\,\\text{TB}') + '\\ (' + r.nVoll + '\\ \\text{Vollsicherungen})'],
        ['Vollsicherung', 't = \\frac{' + tz(e.daten * 1e6, 0) + '\\,\\text{MB}}{' + tz(e.rate, 0) + '\\,\\tfrac{\\text{MB}}{\\text{s}}} = ' + E(tz(r.tVoll, 1) + '\\,\\text{h}')],
        ['Wiederherstellung', 't = \\frac{' + tz(r.kette * 1e6, 0) + '\\,\\text{MB}}{' + tz(e.restore, 0) + '\\,\\tfrac{\\text{MB}}{\\text{s}}} \\approx ' + E(tz(r.tRestore, 1) + '\\,\\text{h}') + '\\ (\\text{Kette ' + r.kettenLaenge + '})'],
        ['Außer Haus je Tag', 't = \\frac{' + tz(r.offTag * 1000, 0) + '\\,\\text{GB} \\cdot 8}{' + tz(e.offsite, 0) + '\\,\\tfrac{\\text{Mbit}}{\\text{s}}} = ' + E(tz(r.tOff, 1) + '\\,\\text{h}')]
      ];
    }
    function zeichne(cx, B, H, t, r, e) {
      const Z = R.Z, f = R.farbe;
      const T = e.strategie === 'voll' ? 1 : e.voll;
      const zeig = Math.min(90, e.aufbewahrung + T + 6);
      const heute = zeig - 1 + Math.floor(t / 700) % Math.max(1, T * 2);
      const x0 = 30, x1 = B - 14, y0 = 32, h = H - 80, bw = (x1 - x0) / zeig;
      const farben = { v: '#3B5BDB', i: '#2E8B57', d: '#F2A541' };
      // Wiederherstellungskette für den neuesten Stand
      const letzteVoll = heute - (heute % T);
      for (let s = 0; s < zeig; s++) {
        const d = heute - (zeig - 1 - s);
        if (d < 0) continue;
        const j = jobGroesse(e, d), hh = Math.max(2, h * Math.sqrt(Math.min(1, j[0] / e.daten)));
        const alt = heute - d >= e.aufbewahrung + (heute - letzteVoll);
        const x = x0 + s * bw;
        cx.globalAlpha = alt ? 0.18 : 0.9; cx.fillStyle = farben[j[1]]; cx.fillRect(x + 1, y0 + h - hh, Math.max(1, bw - 2), hh); cx.globalAlpha = 1;
        const inKette = d >= letzteVoll && (e.strategie === 'inkr' || d === letzteVoll || d === heute);
        if (inKette) { cx.strokeStyle = '#C0392B'; cx.lineWidth = 2; cx.strokeRect(x + 0.5, y0 + h - hh - 1, Math.max(1, bw - 1), hh + 1); }
      }
      // Aufbewahrungsfenster
      const xa = x0 + Math.max(0, zeig - e.aufbewahrung) * bw;
      cx.strokeStyle = f('--text'); cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(xa, y0 + h + 8); cx.lineTo(xa, y0 + h + 14); cx.lineTo(x1, y0 + h + 14); cx.lineTo(x1, y0 + h + 8); cx.stroke();
      Z.text(cx, 'Aufbewahrung ' + e.aufbewahrung + ' Tage', (xa + x1) / 2, y0 + h + 26, 'center', 11, true);
      Z.text(cx, 'heute', x1, y0 - 6, 'right', 10, true, f('--leise'));
      Z.text(cx, 'D', x0 - 8, y0, 'right', 10, false, f('--leise'));
      [['v', 'Voll'], ['i', 'Inkrementell'], ['d', 'Differenziell']].forEach(function (l, i) { cx.fillStyle = farben[l[0]]; cx.fillRect(x0 + i * 100, 6, 10, 10); Z.text(cx, l[1], x0 + i * 100 + 14, 11, 'left', 10, false, f('--leise')); });
      Z.text(cx, 'Höhe: Wurzel der Größe', x1, H - 8, 'right', 9, false, f('--leise'));
    }
  })();
  </script>
