  <script>
  (function () {

    // Körpersegmente nach Winter (Biomechanics and Motor Control of Human Movement):
    // Masseanteil und Lage als Anteil der Körpergröße h

      lKopf: 0.112, lRumpfS: 0.144, lRumpf: 0.288, lOber: 0.245, lUnter: 0.246, lFuss: 0.03, sOber: 0.433, sUnter: 0.433,
      lArm: 0.34, schulterbreite: 0.23
    };
    // Stufen der Halteübungen: Hüftbeugung, Kniebeugung je Bein (°), Grätschwinkel (°)
    const STUFEN = {
      tuck: { name: 'Hocke (Tuck)', b1: [140, 150], b2: [140, 150], g: 0 },
      adv: { name: 'Hocke mit flachem Rücken (Advanced Tuck)', b1: [90, 135], b2: [90, 135], g: 0 },
      einbein: { name: 'ein Bein gestreckt', b1: [0, 0], b2: [90, 135], g: 0 },
      graetsche: { name: 'Grätsche (Straddle)', b1: [0, 0], b2: [0, 0], g: 90 },
      voll: { name: 'gestreckt (Full)', b1: [0, 0], b2: [0, 0], g: 0 }

    const UEBUNG = { front: 'Front Lever', back: 'Back Lever', planche: 'Planche' };
    // Schlag und Tritt: wirksame Masse als Anteil der Körpermasse (Richtwerte aus Messungen am Kraftaufnehmer)

      arm: ['Faustschlag nur aus dem Arm', 0.035, 7],
      huefte: ['Faustschlag mit Hüftdrehung', 0.06, 9],
      schritt: ['Faustschlag mit Schritt und Gewichtsverlagerung', 0.09, 9],
      front: ['Vorwärtstritt (Ferse oder Ballen)', 0.10, 11],
      kreis: ['Halbkreistritt mit Hüftdrehung', 0.14, 14]
    };
    const ZIEL = { pratze: ['Pratze, fest gehalten', 12, 0], sack: ['schwerer Sandsack', 18, 40], brett: ['Brett beim Bruchtest', 5, 0], frei: ['eigene Angaben', 12, 0] };
    const FLAECHE = { faust: ['Faust, flach (zwei Knöchelreihen)', 25], knoechel: ['zwei Knöchel', 5], kante: ['Handkante', 10], ferse: ['Ferse', 20], ballen: ['Fußballen', 15] };
    // Fallen: wirksamer Bremsweg (cm) und Aufprallfläche (cm²)
    const FALL = {
      hart: ['ohne Technik auf harten Boden ohne Matte (Ellbogen, Hüfte, Kopf)', 2, 60],
      matte: ['ohne Technik auf die Matte', 1, 300],
      abschlagen: ['Fallschule mit Abschlagen (Ukemi)', 15, 2500],
      rollen: ['Abrollen über die Schulter', 50, 1500]
    };

    const BEISPIEL = {
      thema: 'hebel', m: 75, h: 1.78,
      uebung: 'front', stufe: 'adv', neigung: 0, huefte: 90, knie: 135, graetsche: 0,
      art: 'liege', hoch: 0, griff: 0.6, zusatz: 0, weg: 0.4, zeit: 1.2,
      technik: 'huefte', meff: 4.5, v: 9, ziel: 'pratze', dt: 12, M: 0, flaeche: 'faust',
      fall: 'abschlagen', fh: 1.0, matte: 4
    };

    R.seite({
      titel: 'Sport und Bewegung',
      einleitung: 'Calisthenics und Kampfkunst mit Physik erklärt: Drehmoment bei Front Lever, Back Lever und Planche je nach Stufe, Last auf den Händen bei Liegestütz, Klimmzug und Dip, Impuls, Energie und Kraft von Schlag und Tritt, Aufprallkraft beim Fallen und warum Abrollen schützt.',
      hilfe: 'Die Rechnungen zeigen die Mechanik mit einem Körpermodell nach Winter (Masseanteile und Längen der Körpersegmente). Sie sind keine Trainings- oder Gesundheitsempfehlung; echte Werte hängen von Körperbau und Technik ab.',
      gruppen: [
        { titel: 'Thema', farbe: '#6E6FA6', felder: [
          { k: 'thema', name: 'Was soll berechnet werden?', wahl: [['hebel', 'Halteübungen: Front Lever, Back Lever, Planche'], ['stuetz', 'Liegestütz, Klimmzug und Dip'], ['schlag', 'Schlag und Tritt'], ['fall', 'Fallen und Abrollen']] }
        ] },
        { titel: 'Körper', farbe: '#1E3A5F', felder: [
          { k: 'm', tex: 'm', name: 'Körpermasse', e: 'kg', min: 20, max: 200 },
          { k: 'h', tex: 'h', name: 'Körpergröße', e: 'm', min: 1, max: 2.3, wenn: function (e) { return e.thema === 'hebel' || e.thema === 'stuetz'; } }
        ] },
        { titel: 'Halteübung', farbe: '#E4572E', wenn: function (e) { return e.thema === 'hebel'; }, felder: [
          { k: 'uebung', name: 'Übung', wahl: [['front', 'Front Lever (hängend, Bauch nach oben)'], ['back', 'Back Lever (hängend, Bauch nach unten)'], ['planche', 'Planche (Stütz auf den Händen)']] },
          { k: 'stufe', name: 'Stufe', wahl: Object.keys(STUFEN).map(function (k) { return [k, STUFEN[k].name]; }).concat([['eigen', 'eigene Winkel']]) },
          { k: 'neigung', tex: '\\vartheta', name: 'Körper gegen die Waagerechte (Füße höher +)', e: '°', min: -60, max: 60, hilfe: '0° = waagerecht; schräg halten verkürzt den Hebel' },
          { k: 'huefte', tex: '\\varphi_\\text{H}', name: 'Hüftbeugung', e: '°', min: 0, max: 150, wenn: function (e) { return e.stufe === 'eigen'; } },
          { k: 'knie', tex: '\\varphi_\\text{K}', name: 'Kniebeugung', e: '°', min: 0, max: 160, wenn: function (e) { return e.stufe === 'eigen'; } },
          { k: 'graetsche', tex: '\\sigma', name: 'Grätschwinkel zwischen den Beinen', e: '°', min: 0, max: 180, wenn: function (e) { return e.stufe === 'eigen'; } }
        ] },
        { titel: 'Übung', farbe: '#2B7BB9', wenn: function (e) { return e.thema === 'stuetz'; }, felder: [
          { k: 'art', name: 'Übung', wahl: [['liege', 'Liegestütz'], ['knie', 'Liegestütz auf den Knien'], ['klimm', 'Klimmzug'], ['dip', 'Dip am Barren']] },
          { k: 'hoch', tex: '\\Delta h', name: 'Hände höher als Füße (Füße höher: negativ)', e: 'm', min: -1, max: 1.2, wenn: function (e) { return e.art === 'liege' || e.art === 'knie'; } },
          { k: 'griff', tex: 'b', name: 'Griffbreite (Abstand der Hände)', e: 'm', min: 0.1, max: 1.5, wenn: function (e) { return e.art === 'klimm'; } },
          { k: 'zusatz', tex: 'm_\\text{Z}', name: 'Zusatzgewicht (Weste, Gürtel)', e: 'kg', min: 0, max: 150 },
          { k: 'weg', tex: 's', name: 'Hubweg der Bewegung', e: 'm', min: 0.05, max: 1 },
          { k: 'zeit', tex: 'T', name: 'Zeit für das Hochdrücken bzw. Hochziehen', e: 's', min: 0.2, max: 10 }
        ] },
        { titel: 'Schlag oder Tritt', farbe: '#C0392B', wenn: function (e) { return e.thema === 'schlag'; }, felder: [
          { k: 'technik', name: 'Technik', wahl: Object.keys(TECHNIK).map(function (k) { return [k, TECHNIK[k][0]]; }).concat([['eigen', 'eigene wirksame Masse']]) },
          { k: 'meff', tex: 'm_\\text{w}', name: 'wirksame Masse', e: 'kg', min: 0.5, max: 40, wenn: function (e) { return e.technik === 'eigen'; }, hilfe: 'der Teil der Körpermasse, der im Treffer „mitgeht“' },
          { k: 'v', tex: 'v', name: 'Geschwindigkeit beim Treffer', e: 'm/s', min: 1, max: 30, hilfe: 'Faustschläge etwa 6 bis 12 m/s, Tritte etwa 9 bis 16 m/s' },
          { k: 'ziel', name: 'Ziel', wahl: Object.keys(ZIEL).map(function (k) { return [k, ZIEL[k][0]]; }) },
          { k: 'dt', tex: '\\Delta t', name: 'Kontaktzeit', e: 'ms', min: 1, max: 100, wenn: function (e) { return e.ziel === 'frei'; } },
          { k: 'M', tex: 'M', name: 'Masse des Ziels (0 = fest)', e: 'kg', min: 0, max: 500, wenn: function (e) { return e.ziel === 'frei'; } },
          { k: 'flaeche', name: 'Trefferfläche', wahl: Object.keys(FLAECHE).map(function (k) { return [k, FLAECHE[k][0] + ' (' + FLAECHE[k][1] + ' cm²)']; }) }
        ] },
        { titel: 'Fallen', farbe: '#0E6B6A', wenn: function (e) { return e.thema === 'fall'; }, felder: [
          { k: 'fall', name: 'Technik', wahl: Object.keys(FALL).map(function (k) { return [k, FALL[k][0]]; }) },
          { k: 'fh', tex: 'h_\\text{F}', name: 'Fallhöhe des Körperschwerpunkts', e: 'm', min: 0.1, max: 3, hilfe: 'Sturz aus dem Stand rückwärts etwa 0,9 bis 1,0 m, aus der Hocke etwa 0,4 m' },
          { k: 'matte', tex: 'd', name: 'Dicke der Matte (gilt nicht für harten Boden)', e: 'cm', min: 0, max: 40 }
        ] }
      ],
      beispiel: BEISPIEL,
      rechne: rechne, ergebnis: ergebnis, weg: weg,
      sammlung: [
        ['Drehmoment um die Schulter', 'M = g \\sum_i m_i \\, x_i', 'x_i: waagerechter Abstand des Segmentschwerpunkts von der Schulter; Segmentmassen nach Winter (Kopf 8,1 %, Rumpf 49,7 %, je Arm 5 %, je Oberschenkel 10 %, je Unterschenkel 4,65 %, je Fuß 1,45 %)'],
        ['Hebelarm des Körpers', 'x_\\text{S} = \\frac{\\sum_i m_i x_i}{\\sum_i m_i}', 'bei der Planche muss der Schwerpunkt über den Händen liegen: die Schultern lehnen um x_S vor'],
        ['Grätsche', 'x = x_\\parallel \\cdot \\cos\\frac{\\sigma}{2}', 'gegrätschte Beine liegen näher an der Schulter'],
        ['Last auf den Händen (Liegestütz)', 'F_\\text{H} = F_\\text{G} \\cdot \\frac{x_\\text{S}}{x_\\text{H}}', 'Momente um die Füße bzw. Knie; Arme etwa senkrecht zum Körper'],
        ['Kraft je Arm am Klimmzug', 'F_\\text{Arm} = \\frac{F_\\text{G}}{2\\cos\\alpha},\\quad \\sin\\alpha = \\frac{(b - b_\\text{S})/2}{l_\\text{Arm}}', 'breiter Griff: schräge Arme, größere Armkraft und Querkraft'],
        ['Spitzenkraft beim Hochziehen', 'F_{\\max} = m\\,(g + a_{\\max}),\\quad a_{\\max} = \\frac{\\pi^2}{2}\\cdot\\frac{s}{T^2}', 'Bewegung mit sanftem Anfahren und Abbremsen (Kosinusverlauf)'],
        ['Impuls und Energie', 'p = m_\\text{w}\\, v,\\quad E = \\tfrac12\\, m_\\text{w}\\, v^2', 'wirksame Masse: Hüftdrehung und Gewichtsverlagerung bringen mehr Körpermasse in den Treffer'],
        ['Stoß auf ein bewegliches Ziel', '\\Delta p = \\frac{m_\\text{w} M}{m_\\text{w} + M}\\, v', 'unelastisch; festes Ziel: M → ∞'],
        ['Kraft im Treffer', '\\bar F = \\frac{\\Delta p}{\\Delta t},\\quad F_{\\max} \\approx \\frac{\\pi}{2}\\,\\bar F', 'Kraftverlauf etwa als Sinus-Halbwelle'],
        ['Aufprall beim Fallen', 'v = \\sqrt{2 g h_\\text{F}},\\quad \\bar F = m g \\left(1 + \\frac{h_\\text{F}}{s}\\right),\\quad F_{\\max} \\approx 2 \\bar F', 's: Bremsweg; federndes Abbremsen verdoppelt etwa die mittlere Kraft'],
        ['Druck auf die Haut', 'p = \\frac{F_{\\max}}{A}', 'Abschlagen und Abrollen verteilen die Kraft auf eine große Fläche']
      ],
      quellen: 'Körpermodell: D. A. Winter, Biomechanics and Motor Control of Human Movement (Segmentmassen und -längen). Liegestütz-Anteile vergleichbar mit Messungen von Ebben u. a. (2011): etwa 64 % des Körpergewichts, auf den Knien etwa 49 %. Wirksame Massen und Geschwindigkeiten von Schlägen und Tritten als Richtwerte aus Messungen am Kraftaufnehmer. Keine Trainings- oder Gesundheitsempfehlung; bei Beschwerden ärztlichen Rat einholen, Fallschule nur unter Anleitung üben.',
      bild: { titel: 'Kräfte am Körper', label: 'Strichfigur mit Kräften und Hebeln zur gewählten Übung', animiert: !bewegungAus,
        hoehe: function (B) { return Math.round(Math.max(250, Math.min(340, B * 0.55))); }, zeichne: zeichne,
        hinweis: function (r, e) {
          if (e.thema === 'hebel') return 'Punkte: Schwerpunkte der Körperteile; der Pfeil zeigt den Hebelarm des ganzen Körpers um die Schulter.';
          if (e.thema === 'stuetz') return e.art === 'klimm' ? 'Je breiter der Griff, desto schräger die Arme und desto größer die Kraft im Arm.' : 'Die Pfeile zeigen, wie sich das Gewicht auf Hände und Füße verteilt.';
          if (e.thema === 'schlag') return 'Kraftverlauf im Treffer: je kürzer der Kontakt, desto höher die Spitze bei gleichem Impuls.';
          return 'Kraftverlauf beim Aufprall: längerer Bremsweg verteilt dieselbe Energie über mehr Zeit.';
        } }
    });

    // ---------- Halteübungen ----------
    function stellung(e) {
      const s = e.stufe === 'eigen' ? { b1: [e.huefte, e.knie], b2: [e.huefte, e.knie], g: e.graetsche } : STUFEN[e.stufe] || STUFEN.voll;
      return s;
    }
    // Punkte entlang der Körperachse (Schulter = 0, x zu den Füßen, y zur Bauchseite), in Metern
    function kette(e, st) {
      const h = e.h, teile = [];
      const P = function (x, y) { return [x * h, y * h]; };
      teile.push({ n: 'Kopf', m: SEG.kopf, p: P(-SEG.lKopf, 0) });
      teile.push({ n: 'Rumpf', m: SEG.rumpf, p: P(SEG.lRumpfS, 0) });
      const huefte = P(SEG.lRumpf, 0);
      const beine = [st.b1, st.b2].map(function (b, i) {
        const ph = b[0] * GRAD, pk = (b[0] - b[1]) * GRAD;
        const knie = [huefte[0] + SEG.lOber * h * Math.cos(ph), huefte[1] + SEG.lOber * h * Math.sin(ph)];
        const fuss = [knie[0] + SEG.lUnter * h * Math.cos(pk), knie[1] + SEG.lUnter * h * Math.sin(pk)];
        const ober = [huefte[0] + SEG.sOber * SEG.lOber * h * Math.cos(ph), huefte[1] + SEG.sOber * SEG.lOber * h * Math.sin(ph)];
        const unter = [knie[0] + SEG.sUnter * SEG.lUnter * h * Math.cos(pk), knie[1] + SEG.sUnter * SEG.lUnter * h * Math.sin(pk)];
        const spitze = [fuss[0] + SEG.lFuss * h * Math.cos(pk), fuss[1] + SEG.lFuss * h * Math.sin(pk)];
        // Grätsche: Beine aus der Körperebene, Abstand entlang der Achse ab der Hüfte mal cos(σ/2)
        const g = Math.cos(st.g / 2 * GRAD);
        const f = function (q) { return [huefte[0] + (q[0] - huefte[0]) * g, q[1]]; };
        teile.push({ n: 'Oberschenkel ' + (i + 1), m: SEG.oberschenkel, p: f(ober) });
        teile.push({ n: 'Unterschenkel ' + (i + 1), m: SEG.unterschenkel, p: f(unter) });
        teile.push({ n: 'Fuß ' + (i + 1), m: SEG.fuss, p: f(fuss) });
        return { knie: f(knie), fuss: f(fuss), spitze: f(spitze) };
      });
      return { teile: teile, huefte: huefte, beine: beine };
    }
    // waagerechter Abstand: Füße höher (+θ) dreht beim Front Lever die Bauchseite (oben) zur Schulter, bei Back Lever und Planche (Bauch unten) weg
    function waagerecht(p, th, bauchOben) { return p[0] * Math.cos(th) - (bauchOben ? 1 : -1) * p[1] * Math.sin(th); }
    function hebelMoment(e, st) {
      const k = kette(e, st), th = e.neigung * GRAD, oben = e.uebung === 'front';
      let sm = 0, smx = 0;
      k.teile.forEach(function (t) { const x = waagerecht(t.p, th, oben); t.x = x; sm += t.m; smx += t.m * x; });
      return { k: k, mAnteil: sm, xS: smx / sm, M: G * e.m * smx, smx: smx };
    }
    function rechneHebel(e) {
      const r = { st: stellung(e) };
      const a = hebelMoment(e, r.st);
      r.k = a.k; r.xS = a.xS; r.M = a.M; r.mK = a.mAnteil * e.m;
      r.voll = hebelMoment(Object.assign({}, e, { neigung: 0 }), STUFEN.voll).M;
      r.anteil = r.M / r.voll;
      r.vergleich = Object.keys(STUFEN).map(function (k) { const x = hebelMoment(e, STUFEN[k]); return { k: k, M: x.M, xS: x.xS }; });
      r.kg1m = r.M / G;                                    // Last am 1-m-Hebel
      r.armLast = r.M / (SEG.lArm * e.h) / G;              // Last an der Hand des ausgestreckten Arms
      if (e.uebung === 'planche') { r.lean = r.xS; r.alpha = Math.asin(Math.min(0.999, r.xS / (SEG.lArm * e.h))) / GRAD; }
      return r;
    }

    // ---------- Liegestütz, Klimmzug, Dip ----------
    const LIEGE = [['kopf', SEG.kopf, 0.93], ['rumpf', SEG.rumpf, 0.674], ['arme', 2 * SEG.arm, 0.818], ['ober', 2 * SEG.oberschenkel, 0.424], ['unter', 2 * SEG.unterschenkel, 0.178]];
    function rechneStuetz(e) {
      const r = { mGes: e.m + e.zusatz }, h = e.h;
      r.FG = r.mGes * G;
      r.aMax = Math.PI * Math.PI / 2 * e.weg / (e.zeit * e.zeit);
      if (e.art === 'liege' || e.art === 'knie') {
        const yp = e.art === 'knie' ? 0.285 : 0.039;
        const L = (0.818 - yp) * h, a = 0.35 * h, gam = 0.2;   // Arme um etwa 11° aus der Senkrechten zum Körper Richtung Füße geneigt
        let sm = 0, smx = 0;
        LIEGE.forEach(function (s) { if (e.art === 'knie' && s[0] === 'unter') return; sm += s[1]; smx += s[1] * (s[2] - yp) * h; });
        // Zusatzgewicht auf dem Rücken: Rumpfschwerpunkt
        const mK = sm * e.m + e.zusatz, mx = smx * e.m + e.zusatz * (0.674 - yp) * h;
        const f = function (t) { return L * Math.sin(t) + a * Math.sin(t - Math.PI / 2 - gam) - e.hoch; };
        let lo = -1.3, hi = 1.5;
        if (f(lo) > 0 || f(hi) < 0) { r.unmoeglich = true; lo = hi = 0; }

    // ---------- Schlag und Tritt ----------
    function rechneSchlag(e) {
      const r = {};

      r.vergleich = Object.keys(TECHNIK).map(function (k) { const mw = TECHNIK[k][1] * e.m, v = TECHNIK[k][2]; const mu = r.M > 0 ? mw * r.M / (mw + r.M) : mw; return [TECHNIK[k][0], mw, v, mw * v, mw * v * v / 2, Math.PI / 2 * mu * v / r.dt]; });

    // ---------- Fallen ----------
    // wirksamer Bremsweg: Grundwert der Technik plus etwa 60 % der Mattendicke (harter Boden: ohne Matte)
    function bremsweg(k, e) { return Math.max(0.005, (FALL[k][1] + (k === 'hart' ? 0 : e.matte * 0.6)) / 100); }

    }

    function rechne(e) {
      if (e.thema === 'stuetz') return rechneStuetz(e);
      if (e.thema === 'schlag') return rechneSchlag(e);

    // ---------- Ergebnis ----------

        H.nachweise([
          e.art === 'liege' ? [null, 'Warum erhöhte Füße schwerer sind', 'Der Körper kippt nach vorn, die Hände rücken näher unter den Schwerpunkt und tragen mehr.'] : null,

          [z(r.v, 1) + ' m/s', 'Geschwindigkeit beim Aufprall', '#2B7BB9'],

          r.vergleich.map(function (v) { return [v[0], z(v[1] * 100, 1) + ' cm', z(v[2] * 1000, 0) + ' ms', kg(v[3]), z(v[4], 1) + ' N/cm²']; }),

          ['Masse ohne Arme', 'm_\\text{K} = ' + tz(e.m, 1) + '\\,\\text{kg} \\cdot ' + tz(1 - 2 * SEG.arm, 2) + ' = ' + E(tz(r.mK, 1) + '\\,\\text{kg}')],
          ['Summe der Momente (Massenanteil · waagerechter Abstand in m)', '\\sum \\frac{m_i}{m} x_i = ' + sum.slice(0, 4).join(' + ') + ' + \\dots = ' + tz(r.M / G / e.m, 3) + '\\,\\text{m}'],

          w.push(['Kraft je Arm', 'F_\\text{Arm} = \\frac{' + tz(r.FG, 0) + '}{2 \\cos ' + tz(r.alpha, 1) + '^\\circ} = ' + E(tz(r.arm, 0) + '\\,\\text{N}')]);

        ['Energie', 'E = ' + tz(e.m, 1) + ' \\cdot ' + tz(G, 2) + ' \\cdot ' + tz(e.fh, 2) + ' = ' + E(tz(r.Ekin, 0) + '\\,\\text{J}')],
        ['Mittlere Kraft über ' + tz(r.s * 100, 1) + '\\,cm Bremsweg', '\\bar F = ' + tz(e.m, 1) + ' \\cdot ' + tz(G, 2) + ' \\cdot \\left(1 + \\frac{' + tz(e.fh, 2) + '}{' + tz(r.s, 3) + '}\\right) = ' + E(tz(r.F, 0) + '\\,\\text{N}')],
        ['Spitzenkraft und Dauer', 'F_{\\max} \\approx 2 \\cdot ' + tz(r.F, 0) + ' = ' + E(tz(r.Fmax, 0) + '\\,\\text{N}') + ',\\quad \\Delta t = \\frac{2 \\cdot ' + tz(r.s, 3) + '}{' + tz(r.v, 2) + '} = ' + E(tz(r.dt * 1000, 0) + '\\,\\text{ms}')],
