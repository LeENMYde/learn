<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formeln &amp; Rechner</title>
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  <link rel="stylesheet" href="assets/stil.css">
  <script src="assets/basis.js"></script>

  <style>
    .suche {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 26px 0 8px;
    }

    .suche input {
      flex: 1 1 280px;
      padding: 12px 16px;
      border: 1px solid var(--linie);
      border-radius: 999px;
      background: var(--flaeche);
      font-size: 1.05rem;
    }

    .bereich-kopf {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 30px 0 12px;
    }

    .bereich-kopf h2 { margin: 0; font-size: 1.6rem; }
    .bereich-kopf h2::before { content: '#'; color: var(--warm); }
    .bereich-kopf span { color: var(--leise); }

    .leer { color: var(--leise); padding: 20px 0; }
  </style>
</head>

<body>
  <div id="seitenkopf" data-wurzel="" data-seite="start"></div>

  <main class="seite">
    <section class="held">
      <h1><span class="unterstrichen">Formeln, Rechner und Simulationen</span></h1>
      <p>Eine Sammlung zum Nachrechnen und Ausprobieren: Wert eintragen, zusehen, was passiert, und den Rechenweg Schritt für Schritt nachlesen. Alles läuft im Browser, auch ohne Internet.</p>
    </section>

    <div class="band" aria-hidden="true"><div class="band-innen" id="band"></div></div>

    <div class="suche" id="bereiche">
      <input type="search" id="suchfeld" placeholder="Suchen, z. B. Wärme, Drehstrom, Kosten" aria-label="Rechner suchen">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Nach Thema filtern"></div>

    <div id="liste"></div>
  </main>

  <div id="seitenfuss"></div>

  <script src="assets/katex/katex.min.js"></script>
  <script src="assets/katalog.js"></script>
  <script>
  (function () {
    'use strict';

    const eintraege = window.KATALOG || [];
    let filter = '';

    // Alle Bereiche und Themen, einmal
    const themen = [];
    eintraege.forEach(function (e) {
      [e.bereich].concat(e.themen).forEach(function (t) { if (themen.indexOf(t) < 0) themen.push(t); });
    });

    // Laufband: eine Hälfte breiter als jeder Bildschirm, zweimal hintereinander, dann schließt die Schleife nahtlos
    const band = document.getElementById('band');
    let haelfte = [];
    while (haelfte.length < 40) haelfte = haelfte.concat(themen);
    haelfte.concat(haelfte).forEach(function (t) {
      const s = document.createElement('span');
      s.textContent = t;
      band.append(s);
    });

    const chips = document.getElementById('chips');
    themen.forEach(function (t) {
      const k = document.createElement('button');
      k.type = 'button'; k.className = 'chip'; k.textContent = t;
      k.setAttribute('aria-pressed', 'false');
      k.addEventListener('click', function () {
        filter = filter === t ? '' : t;
        chips.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === filter)); });
        zeigen();
      });
      chips.append(k);
    });

    document.getElementById('suchfeld').addEventListener('input', zeigen);

    function passt(e) {
      const suche = document.getElementById('suchfeld').value.trim().toLowerCase();
      const alles = [e.titel, e.text, e.bereich].concat(e.themen).join(' ').toLowerCase();
      const imFilter = !filter || e.bereich === filter || e.themen.indexOf(filter) >= 0;
      return imFilter && (!suche || suche.split(/\s+/).every(function (w) { return alles.indexOf(w) >= 0; }));
    }

    function karte(e) {
      const a = document.createElement('a');
      a.className = 'karte';
      a.href = e.pfad;

      const bild = document.createElement('div');
      bild.className = 'formelbild';
      Formel.setze(bild, e.tex, true);

      const h = document.createElement('h3'); h.textContent = e.titel;
      const p = document.createElement('p'); p.textContent = e.text;
      const tags = document.createElement('div'); tags.className = 'tags';
      e.themen.forEach(function (t) { const s = document.createElement('span'); s.textContent = t; tags.append(s); });

      a.append(bild, h, p, tags);
      return a;
    }

    function zeigen() {
      const ziel = document.getElementById('liste');
      ziel.innerHTML = '';
      const treffer = eintraege.filter(passt);
      if (!treffer.length) {
        ziel.innerHTML = '<p class="leer">Nichts gefunden. Anderen Begriff versuchen oder den Filter aufheben.</p>';
        return;
      }
      const bereiche = [];
      treffer.forEach(function (e) { if (bereiche.indexOf(e.bereich) < 0) bereiche.push(e.bereich); });
      bereiche.forEach(function (b) {
        const liste = treffer.filter(function (e) { return e.bereich === b; });
        const kopf = document.createElement('div');
        kopf.className = 'bereich-kopf';
        kopf.innerHTML = '<h2></h2><span></span>';
        kopf.querySelector('h2').textContent = b;
        kopf.querySelector('span').textContent = liste.length + (liste.length === 1 ? ' Eintrag' : ' Einträge');
        const raster = document.createElement('div');
        raster.className = 'raster';
        liste.forEach(function (e) { raster.append(karte(e)); });
        ziel.append(kopf, raster);
      });
    }

    zeigen();
  })();
  </script>
</body>
</html>
