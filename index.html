<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formeln &amp; Rechner</title>
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  <link rel="stylesheet" href="assets/stil.css">
  <script src="assets/basis.js"></script>

  <style>
    /* Übersicht: nach Bereichen gegliedert, ohne Hashtags */
    .werkzeug { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 22px 0 6px; }
    .werkzeug input {
      flex: 1 1 260px; padding: 11px 16px; border: 1px solid var(--linie); border-radius: 999px; background: var(--flaeche); font-size: 1.02rem;
    }
    .reiter { display: flex; flex-wrap: wrap; gap: 6px; }
    .reiter button {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--linie);
      background: var(--flaeche); color: var(--text); font-family: var(--technik); font-size: 1rem; cursor: pointer;
    }
    .reiter button:hover { border-color: var(--leise); }
    .reiter button[aria-pressed="true"] { background: var(--text); color: var(--grund); border-color: var(--text); }
    .reiter i { width: 10px; height: 10px; border-radius: 50%; background: var(--farbe, var(--leise)); }
    .reiter small { color: inherit; opacity: .65; font-size: .85rem; }

    .bereich { margin: 34px 0 0; }
    .bereich-kopf { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--linie); }
    .bereich-kopf i { width: 14px; height: 14px; border-radius: 4px; background: var(--farbe); flex: none; }
    .bereich-kopf h2 { margin: 0; font-size: 1.55rem; }
    .bereich-kopf span { color: var(--leise); margin-left: auto; font-size: .92rem; }
    .gruppe-titel { margin: 18px 0 10px; font-family: var(--technik); font-weight: 600; font-size: 1rem; color: var(--leise); letter-spacing: .02em; }

    .raster { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
    .karte { gap: 8px; border-top: 4px solid var(--farbe); }
    .karte .formelbild { min-height: 54px; font-size: 1.05rem; padding: 10px; }
    .karte h3 { font-size: 1.25rem; }
    .karte p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: .92rem; }
    .karte .stichworte { margin-top: auto; color: var(--leise); font-size: .84rem; }

    .leer { color: var(--leise); padding: 20px 0; }
  </style>
</head>

<body>
  <div id="seitenkopf" data-wurzel="" data-seite="start"></div>

  <main class="seite">
    <section class="held">
      <h1><span class="unterstrichen">Formeln, Rechner und Simulationen</span></h1>
      <p>Eine Sammlung zum Nachrechnen und Ausprobieren: Wert eintragen, zusehen, was passiert, und den Rechenweg Schritt für Schritt nachlesen. Alles läuft im Browser, auch ohne Internet.</p>
    </section>

    <div class="werkzeug" id="bereiche">
      <div class="reiter" id="reiter" role="group" aria-label="Bereich wählen"></div>
      <input type="search" id="suchfeld" placeholder="Suchen, z. B. Spannungsfall, Legionellen, Kräfte" aria-label="Seiten durchsuchen">
    </div>

    <div id="liste"></div>
  </main>

  <div id="seitenfuss"></div>

  <script src="assets/katex/katex.min.js"></script>
  <script>
  (function () {
    'use strict';

    /*
     * Alle Rechner, Formelsammlungen und Simulationen
     * ===============================================
     * Neue Seite: hier einen Eintrag ergänzen, die Übersicht zeigt ihn dann unter seinem Bereich an.
     *
     *   titel    Name auf der Karte
     *   pfad     relativ zu dieser Datei
     *   bereich  Kategorie, wird zur Überschrift und zum Reiter oben
     *   gruppe   Untergruppe im Bereich (darf fehlen)
     *   themen   Stichwörter für die Suche, die ersten drei stehen auf der Karte
     *   text     ein Satz, was man dort tun kann
     *   tex      eine typische Formel als Erkennungszeichen (LaTeX, darf fehlen)
     */
    const eintraege = [
      {
        titel: 'Warmwasser-Rechner',
        gruppe: 'Energie und Photovoltaik',
        pfad: 'elektro/warmwasser.html',
        bereich: 'Elektrotechnik',
        themen: ['Wärme', 'Energie', 'Wasserkosten', 'Jahreskosten', 'Wirkungsgrad'],
        text: 'Kochendwassergerät, Boiler, Durchlauferhitzer und druckfester Speicher: Wärmemenge, Heizzeit, Leistung, Strom- und Wasserkosten bis aufs Jahr, in jede Richtung und mit Rechenweg.',
        tex: 'Q = m_\\text{w} \\cdot c \\cdot \\Delta T'
      },
      {
        titel: 'Leitungsdimensionierung',
        gruppe: 'Installation und Schutz',
        pfad: 'elektro/leitungsdimensionierung.html',
        bereich: 'Elektrotechnik',
        themen: ['Leitungen', 'Spannungsfall', 'Schutzorgane', 'Kurzschluss', 'Verlustkosten'],
        text: 'Gleich-, Wechsel- und Drehstrom: Betriebsstrom, Schutzorgan, Querschnitt nach Verlegeart, Spannungsfall, Abschaltbedingung und Leitungsverluste, mit allen Nachweisen und Rechenweg.',
        tex: '\\Delta U = \\frac{2 \\cdot l \\cdot I \\cdot \\cos\\varphi}{\\kappa \\cdot A}'
      },
      {
        titel: 'Ohmsches Gesetz und Kirchhoff',
        gruppe: 'Grundlagen',
        pfad: 'elektro/ohmsches-gesetz.html',
        bereich: 'Elektrotechnik',
        themen: ['Ohmsches Gesetz', 'Maschenregel', 'Knotenregel', 'Reihenschaltung', 'Parallelschaltung', 'Leistung'],
        text: 'Spannung, Strom und Widerstand in jede Richtung rechnen, Reihen- und Parallelschaltung mit fließenden Ladungen, Maschenumlauf mit Potentialdiagramm und Knotenregel.',
        tex: 'U = R \\cdot I'
      },
      {
        titel: 'Transformator',
        gruppe: 'Grundlagen',
        pfad: 'elektro/transformator.html',
        bereich: 'Elektrotechnik',
        themen: ['Übersetzung', 'Hauptgleichung', 'Wirkungsgrad', 'Kurzschlussspannung', 'Spannungsfall', 'Schaltgruppen', 'Drehstrom'],
        text: 'Idealer Transformator in jede Richtung gerechnet, Eisen- und Kupferverluste mit bester Auslastung, Kurzschlussversuch und Kapp-Dreieck, Drehstrom mit Schaltgruppe und Kennzahl.',
        tex: '\\ddot{u} = \\frac{U_1}{U_2} = \\frac{N_1}{N_2} = \\frac{I_2}{I_1}'
      },
      {
        titel: 'PV und Notstrom',
        gruppe: 'Energie und Photovoltaik',
        pfad: 'elektro/pv-notstrom.html',
        bereich: 'Elektrotechnik',
        themen: ['Photovoltaik', 'Stromspeicher', 'Notstrom', 'Inselbetrieb', 'Autarkie', 'Strings'],
        text: 'PV-Anlage mit Ertrag, Eigenverbrauch, Amortisation und Stringauslegung, dazu Speicher und Notstrom bis zum Inselbetrieb: welche Geräte bei Netzausfall je Phase laufen, mit Anlaufspitzen, Laufzeit und Schutzkonzept.',
        tex: 't_\\text{NS} = \\frac{W_\\text{NS}}{W_\\text{Tag}} \\cdot 24\\,\\text{h}'
      },
      {
        titel: 'PV-Dachplaner',
        gruppe: 'Energie und Photovoltaik',
        pfad: 'elektro/pv-dach.html',
        bereich: 'Elektrotechnik',
        themen: ['Photovoltaik', 'Modulfeld', 'Hindernisse', 'Gaube', 'Dachknick', 'Sparren', 'Schienen', 'Schneelast'],
        text: 'Dach mit Knick, Gauben und mehreren Seiten zeichnen, Fenster, Schornstein und Co. mit Sicherheitsabstand setzen, Module verschieben oder automatisch verlegen. Konflikte werden rot, Haken, Lasten und Ertrag mit Formeln.',
        tex: 'n_\\text{S} = \\left\\lfloor \\frac{b_\\text{N} + f}{m_x + f} \\right\\rfloor'
      },
      {
        titel: 'Selektivität',
        gruppe: 'Installation und Schutz',
        pfad: 'elektro/selektivitaet.html',
        bereich: 'Elektrotechnik',
        themen: ['Schutzorgane', 'Selektivität', 'Kennlinien', 'Kurzschluss', 'RCD'],
        text: 'Sicherungen gG und aM, LS-Schalter B bis Z, SLS und Leistungsschalter hintereinander: Kennlinien, Selektivitätsgrenze je Paar, Kurzschlussströme, Schaltvermögen, Abschaltbedingung und RCD-Staffelung.',
        tex: 'I_\\text{s}: \\; t_\\text{max,nach} < t_\\text{min,vor}'
      },
      {
        titel: 'Kräfte',
        pfad: 'mechanik/kraefte.html',
        bereich: 'Mechanik',
        themen: ['Kräfte', 'Kräfteparallelogramm', 'Zerlegung', 'Resultierende', 'Schiefe Ebene'],
        text: 'Kräfte zusammensetzen und zerlegen: auf einer Wirkungslinie, rechtwinklig, unter beliebigem Winkel mit dem Kräfteparallelogramm und auf der schiefen Ebene, mit Rechenweg.',
        tex: 'F_\\text{R} = \\sqrt{F_1^2 + F_2^2 + 2 F_1 F_2 \\cos\\alpha}'
      },
      {
        titel: 'Abwasser bemessen',
        pfad: 'sanitaer/abwasser.html',
        bereich: 'Sanitärtechnik',
        themen: ['Schmutzwasser', 'Regenwasser', 'Anschlusswerte', 'Teilfüllung', 'Gefälle', 'Nennweite'],
        text: 'Schmutzwasserabfluss aus den Anschlusswerten, Regenabfluss von Dach und Hof, Grundleitung bemessen mit Füllungsgrad, Fließgeschwindigkeit und Mindestgefälle.',
        tex: 'Q_\\text{ww} = K \\cdot \\sqrt{\\textstyle\\sum DU}'
      },
      {
        titel: 'Trinkwasserschutz',
        pfad: 'sanitaer/trinkwasserschutz.html',
        bereich: 'Sanitärtechnik',
        themen: ['Legionellen', 'Zirkulation', 'Stagnation', '3-Liter-Regel', 'Thermische Desinfektion', 'DIN EN 1717'],
        text: 'Wann sich Legionellen vermehren und wann sie absterben, eine Warmwasseranlage drei Wochen im Zeitraffer, die 3-Liter-Regel mit Wartezeit am Hahn und der Schutz vor Rückfließen.',
        tex: 'D(T) = D_{60} \\cdot 10^{(60\\,{}^\\circ\\text{C} - T)/z}'
      },
      {
        titel: 'Brandsimulation',
        pfad: 'brandschutz/brandsimulation.html',
        bereich: 'Brandschutz',
        themen: ['Flashover', 'Rauch', 'Sprinkler', 'Rauchmelder', 'Evakuierung', 'Waldbrand', 'Löschmittel', 'Feuerwiderstand', 'Explosionsgrenzen'],
        text: 'Raumbrand mit Rauchschicht und Flashover, Gebäudebrand mit Flucht und Feuerwehr, Waldbrand mit Wind und Funkenflug, Löschtrainer, Feuerwiderstand von Stahl, Holz und Beton sowie Gasexplosionen.',
        tex: '\\dot{Q} = \\alpha \\cdot t^2'
      },
      {
        titel: 'Gaubenwange bekleiden',
        pfad: 'dach/gaubenwange.html',
        bereich: 'Dach und Klempnerei',
        themen: ['Gaube', 'Stehfalz', 'Scharen', 'Zuschnitt', 'Winkel', 'Blech', 'Spiegeln', 'PDF'],
        text: 'Gaubenoberkante, vordere Höhe, Scharbreite und Dachneigung eingeben: oberer Winkel, alle Scharen mit Zuschnittlängen, Versatz und Schrägmaß, Zeichnung für links und rechts, als PDF oder E-Mail für die Werkstatt.',
        tex: '\\gamma = \\arcsin\\frac{H \\cdot \\cos\\alpha}{L_\\text{o}}'
      }
    ];

    // Reihenfolge und Farben der Bereiche; Untergruppen in dieser Reihenfolge
    const BEREICHE = { 'Elektrotechnik': '#2B7BB9', 'Mechanik': '#6E6FA6', 'Sanitärtechnik': '#0E6B6A', 'Brandschutz': '#E4572E', 'Dach und Klempnerei': '#A0785A' };
    const GRUPPEN = ['Grundlagen', 'Installation und Schutz', 'Energie und Photovoltaik'];
    const farbe = function (b) { return BEREICHE[b] || 'var(--leise)'; };

    const bereiche = [];
    Object.keys(BEREICHE).concat(eintraege.map(function (e) { return e.bereich; })).forEach(function (b) {
      if (bereiche.indexOf(b) < 0 && eintraege.some(function (e) { return e.bereich === b; })) bereiche.push(b);
    });

    let auswahl = '';
    const reiter = document.getElementById('reiter');
    [''].concat(bereiche).forEach(function (b) {
      const k = document.createElement('button');
      k.type = 'button';
      k.style.setProperty('--farbe', b ? farbe(b) : 'var(--leise)');
      const anzahl = b ? eintraege.filter(function (e) { return e.bereich === b; }).length : eintraege.length;
      k.innerHTML = (b ? '<i aria-hidden="true"></i>' : '') + '<span></span> <small>' + anzahl + '</small>';
      k.querySelector('span').textContent = b || 'Alle';
      k.setAttribute('aria-pressed', String(b === auswahl));
      k.addEventListener('click', function () {
        auswahl = b;
        reiter.querySelectorAll('button').forEach(function (x, i) { x.setAttribute('aria-pressed', String(([''].concat(bereiche))[i] === auswahl)); });
        zeigen();
      });
      reiter.append(k);
    });

    document.getElementById('suchfeld').addEventListener('input', zeigen);

    function passt(e) {
      const suche = document.getElementById('suchfeld').value.trim().toLowerCase();
      const alles = [e.titel, e.text, e.bereich, e.gruppe || ''].concat(e.themen).join(' ').toLowerCase();
      return (!auswahl || e.bereich === auswahl) && (!suche || suche.split(/\s+/).every(function (w) { return alles.indexOf(w) >= 0; }));
    }

    function karte(e) {
      const a = document.createElement('a');
      a.className = 'karte';
      a.href = e.pfad;
      a.style.setProperty('--farbe', farbe(e.bereich));
      if (e.tex) {
        const bild = document.createElement('div');
        bild.className = 'formelbild';
        Formel.setze(bild, e.tex, true);
        a.append(bild);
      }
      const h = document.createElement('h3'); h.textContent = e.titel;
      const p = document.createElement('p'); p.textContent = e.text;
      const w = document.createElement('div'); w.className = 'stichworte'; w.textContent = e.themen.slice(0, 3).join(' · ');
      a.append(h, p, w);
      return a;
    }

    function zeigen() {
      const ziel = document.getElementById('liste');
      ziel.innerHTML = '';
      const treffer = eintraege.filter(passt);
      if (!treffer.length) {
        ziel.innerHTML = '<p class="leer">Nichts gefunden. Anderen Begriff versuchen oder „Alle“ wählen.</p>';
        return;
      }
      bereiche.forEach(function (b) {
        const liste = treffer.filter(function (e) { return e.bereich === b; });
        if (!liste.length) return;
        const abschnitt = document.createElement('section');
        abschnitt.className = 'bereich';
        abschnitt.style.setProperty('--farbe', farbe(b));
        const kopf = document.createElement('div');
        kopf.className = 'bereich-kopf';
        kopf.innerHTML = '<i aria-hidden="true"></i><h2></h2><span></span>';
        kopf.querySelector('h2').textContent = b;
        kopf.querySelector('span').textContent = liste.length + (liste.length === 1 ? ' Seite' : ' Seiten');
        abschnitt.append(kopf);
        // Untergruppen, falls vorhanden; sonst ein Raster
        const gruppen = [];
        GRUPPEN.concat(liste.map(function (e) { return e.gruppe || ''; })).forEach(function (gr) {
          if (gruppen.indexOf(gr) < 0 && liste.some(function (e) { return (e.gruppe || '') === gr; })) gruppen.push(gr);
        });
        gruppen.forEach(function (gr) {
          if (gr && gruppen.length > 1) {
            const t = document.createElement('div'); t.className = 'gruppe-titel'; t.textContent = gr;
            abschnitt.append(t);
          }
          const raster = document.createElement('div');
          raster.className = 'raster';
          liste.filter(function (e) { return (e.gruppe || '') === gr; }).forEach(function (e) { raster.append(karte(e)); });
          abschnitt.append(raster);
        });
        ziel.append(abschnitt);
      });
    }
    zeigen();
  })();
  </script>
</body>
</html>
