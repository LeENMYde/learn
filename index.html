    <section class="seite alle-links" aria-label="Alle Rechner">
      <h2>Alle Rechner und Werkzeuge</h2>
      <ul>
        <li><a href="elektro/warmwasser.html">Warmwasser-Rechner</a> – Kochendwassergerät, Boiler, Durchlauferhitzer und druckfester Speicher: Wärmemenge, Heizzeit, Leistung, Strom- und Wasserkosten bis aufs Jahr, in jede Richtung und mit Rechenweg.</li>
        <li><a href="elektro/leitungsdimensionierung.html">Leitungsdimensionierung</a> – Gleich-, Wechsel- und Drehstrom: Betriebsstrom, Schutzorgan, Querschnitt nach Verlegeart, Spannungsfall, Abschaltbedingung und Leitungsverluste, mit allen Nachweisen und Rechenweg.</li>
        <li><a href="elektro/ohmsches-gesetz.html">Ohmsches Gesetz und Kirchhoff</a> – Spannung, Strom und Widerstand in jede Richtung rechnen, Reihen- und Parallelschaltung mit fließenden Ladungen, Maschenumlauf mit Potentialdiagramm und Knotenregel.</li>
        <li><a href="elektro/transformator.html">Transformator</a> – Idealer Transformator in jede Richtung gerechnet, Eisen- und Kupferverluste mit bester Auslastung, Kurzschlussversuch und Kapp-Dreieck, Drehstrom mit Schaltgruppe und Kennzahl.</li>
        <li><a href="elektro/pv-notstrom.html">PV und Notstrom</a> – PV-Anlage mit Ertrag, Eigenverbrauch, Amortisation und Stringauslegung, dazu Speicher und Notstrom bis zum Inselbetrieb: welche Geräte bei Netzausfall je Phase laufen, mit Anlaufspitzen, Laufzeit und Schutzkonzept.</li>
        <li><a href="elektro/pv-dach.html">PV-Dachplaner</a> – Dach mit Knick, Gauben und mehreren Seiten zeichnen, Fenster, Schornstein und Co. mit Sicherheitsabstand setzen, Module verschieben oder automatisch verlegen. Konflikte werden rot, Haken, Lasten und Ertrag mit Formeln.</li>
        <li><a href="elektro/selektivitaet.html">Selektivität</a> – Sicherungen gG und aM, LS-Schalter B bis Z, SLS und Leistungsschalter hintereinander: Kennlinien, Selektivitätsgrenze je Paar, Kurzschlussströme, Schaltvermögen, Abschaltbedingung und RCD-Staffelung.</li>
        <li><a href="mechanik/kraefte.html">Kräfte</a> – Kräfte zusammensetzen und zerlegen: auf einer Wirkungslinie, rechtwinklig, unter beliebigem Winkel mit dem Kräfteparallelogramm und auf der schiefen Ebene, mit Rechenweg.</li>
        <li><a href="sanitaer/abwasser.html">Abwasser bemessen</a> – Schmutzwasserabfluss aus den Anschlusswerten, Regenabfluss von Dach und Hof, Grundleitung bemessen mit Füllungsgrad, Fließgeschwindigkeit und Mindestgefälle.</li>
        <li><a href="sanitaer/trinkwasserschutz.html">Trinkwasserschutz</a> – Wann sich Legionellen vermehren und wann sie absterben, eine Warmwasseranlage drei Wochen im Zeitraffer, die 3-Liter-Regel mit Wartezeit am Hahn und der Schutz vor Rückfließen.</li>
        <li><a href="sanitaer/gasleitung.html">Gasleitung bemessen</a> – Rohrnetzberechnung für Gasleitungen nach TRGI und TRF: Teilstrecken, Belastung, Volumenstrom, Druckverlust mit Formstücken, Zähler, Strömungswächter, Höhenunterschied und Fließdruck an jedem Gerät, mit automatischer Bemessung.</li>
        <li><a href="brandschutz/brandsimulation.html">Brandsimulation</a> – Raumbrand mit Rauchschicht und Flashover, Gebäudebrand mit Flucht und Feuerwehr, Waldbrand mit Wind und Funkenflug, Löschtrainer, Feuerwiderstand von Stahl, Holz und Beton sowie Gasexplosionen.</li>
        <li><a href="dach/gaubenwange.html">Gaubenwange bekleiden</a> – Gaubenoberkante, vordere Höhe, Scharbreite und Dachneigung eingeben: oberer Winkel, alle Scharen mit Zuschnittlängen, Versatz und Schrägmaß, Zeichnung für links und rechts, als PDF oder E-Mail für die Werkstatt.</li>
        <li><a href="dach/dachrinne.html">Dachrinne und Fallrohr</a> – Regenwasserabfluss nach DIN 1986-100, Rinne mit Längenfaktor und Gefälle nach DIN EN 12056-3, Fallrohr und Ablauf, Notentwässerung und Stückliste mit Haltern und Schellen.</li>
        <li><a href="heizung/heizlast.html">Heizlast und Heizkörper</a> – Raumweise Heizlast nach DIN EN 12831-1 im vereinfachten Verfahren, nötige Normleistung der Heizkörper bei deinen Systemtemperaturen und Volumenstrom je Raum.</li>
        <li><a href="heizung/hydraulischer-abgleich.html">Hydraulischer Abgleich</a> – Verfahren B: Volumenstrom je Heizkörper, Druckverlust der Wege, kv-Wert und Voreinstellung der Ventile, Förderhöhe und Förderstrom der Pumpe.</li>
        <li><a href="heizung/ausdehnungsgefaess.html">Ausdehnungsgefäß und Sicherheitsventil</a> – Membran-Ausdehnungsgefäß nach DIN EN 12828 und VDI 4708: Vordruck, Fülldruck, Enddruck, Nenninhalt und Normgröße, Sicherheitsventil und Ausdehnungsleitung.</li>
        <li><a href="heizung/fussbodenheizung.html">Fußbodenheizung</a> – Nach DIN EN 1264: Wärmestromdichte aus Verlegeabstand und Belag, Grenze der Oberflächentemperatur, nötiger Vorlauf, Heizkreise mit Durchfluss in l/min und Druckverlust.</li>
        <li><a href="heizung/waermepumpe.html">Wärmepumpe auslegen</a> – Leistung mit Sperrzeiten und Warmwasser, Bivalenzpunkt, Heizstab-Anteil, Jahresarbeitszahl im Bin-Verfahren, Strombedarf, Kosten und Pufferspeicher.</li>
        <li><a href="sanitaer/trinkwasser-rohrnetz.html">Trinkwasser-Rohrnetz</a> – Rohrweiten nach DIN 1988-300: Summen- und Spitzendurchfluss, Rohr je Teilstrecke, Rohrreibung, Einzelwiderstände und Druckbilanz bis zur ungünstigsten Entnahmestelle.</li>
        <li><a href="elektro/schleifenimpedanz.html">Schleifenimpedanz und Kurzschlussstrom</a> – Abschaltbedingung nach DIN VDE 0100-410: Schleifenimpedanz, kleinster Kurzschlussstrom, Abschaltstrom, größte Leitungslänge und Grenzwert für die Messung.</li>
        <li><a href="elektro/wallbox.html">Wallbox und Lastmanagement</a> – Ladepunkte am Hausanschluss: freier Strom, Ladestrom mit oder ohne Lastmanagement, Zuleitung, Schutz, Anmeldung und Ladezeit.</li>
        <li><a href="elektro/blitzschutz.html">Blitzschutz: Fangstange und Trennungsabstand</a> – Äußerer Blitzschutz nach DIN EN 62305-3: Fangstange mit dem Blitzkugelverfahren, Durchhang, Ableitungen, Trennungsabstand und Erder.</li>
        <li><a href="elektro/beleuchtung.html">Beleuchtung planen</a> – Innenbeleuchtung nach DIN EN 12464-1: Raumindex, Anzahl und Raster der Leuchten, Wartungswert, Gleichmäßigkeit mit Falschfarbenbild und Leistungsdichte.</li>
        <li><a href="dach/kehle-grat.html">Kehle und Grat</a> – Grat und Kehle bei gleicher oder ungleicher Neigung: Neigung, Lage im Grundriss, wahre Länge, Flächenwinkel für das Kehlblech, Abgratung und Schifter mit Schmiegen.</li>
        <li><a href="dach/schornsteinverwahrung.html">Schornsteinverwahrung</a> – Schornsteineinfassung: Zuschnitte und Biegewinkel für Brust-, Seiten- und Nackenblech, Überhangstreifen, Blechbedarf, Gewicht und Mindesthöhe der Mündung.</li>
        <li><a href="dach/schneefang.html">Schneefang</a> – Schneeschub nach DIN EN 1991-1-3: Schneelast aus Zone und Höhe, Formbeiwert, Kraft je Meter Traufe, Halterabstand, Anzahl der Halter und Reihen.</li>
        <li><a href="dach/sparren-lattung.html">Sparren und Lattung</a> – Satteldach aufmessen: Sparrenlänge und -anzahl, Lattweite aus der Decklänge, Latten und Ziegel, Lattenquerschnitt und Vordimensionierung der Sparrenhöhe.</li>
        <li><a href="elektro/pv-string.html">PV-Strings auslegen</a> – Module je String und Strings je MPP-Tracker: Leerlaufspannung bei Kälte, MPP-Bereich, Kurzschlussstrom, Strangsicherung, DC/AC-Verhältnis und DC-Verlust.</li>
        <li><a href="elektro/pv-verschattung.html">PV-Verschattung</a> – Sonnenstand über das Jahr: Reihenabstand aufgeständerter Module, Schatten von Hindernissen je Monat und geschätzter Ertragsverlust.</li>
        <li><a href="projektmappe.html">Projektmappe</a> – Alle gemerkten Eingaben als Projekt: Bauvorhaben benennen, Projekte speichern und wechseln, als Datei sichern oder weitergeben, Übersicht mit Links drucken.</li>
        <li><a href="protokolle/elektro.html">Elektro-Prüfprotokoll</a> – Anlagen nach DIN VDE 0100-600 und 0105-100 mit Grenzwertprüfung je Stromkreis, Geräte nach DIN EN 50699 und 50678 einzeln oder als Geräteliste, Mängel mit Fristen, Briefkopf, Unterschrift und PDF.</li>
        <li><a href="protokolle/it-sicherheit.html">IT-Sicherheitsprotokoll</a> – Prüfprotokoll für Sicherheitsaudits eigener Server und Dienste: Grundschutz-Checkliste, Port-Scan mit Vorlagen, Findings mit CVSS, Schwachstellen, Unterschrift und PDF.</li>
        <li><a href="elektro/pv-verschaltung.html">PV-Verschaltung und Stromlaufplan</a> – Module auf mehreren Dachflächen anordnen, Strings von Modul zu Modul verlegen, mehrere Wechselrichter, Tracker und Mikro-Wechselrichter mit gemeinsamen Zuleitungen belegen und prüfen; daraus Stringplan, Stromlaufplan und Stückliste.</li>
        <li><a href="mechanik/sport-bewegung.html">Sport und Bewegung</a> – Calisthenics und Kampfkunst mit Physik: Drehmoment bei Front Lever, Back Lever und Planche je Stufe, Last auf den Händen bei Liegestütz, Klimmzug und Dip, Impuls und Kraft von Schlag und Tritt, Aufprallkraft beim Fallen und Abrollen.</li>
        <li><a href="brandschutz/brandmeldeanlage.html">Brandmeldeanlage</a> – Brandmeldeanlage planen und simulieren: Melder je Raum nach DIN VDE 0833-2, Ringleitung mit Kurzschlusstrennern, Notstrom-Akku und Spannungsfall, dann einen Brand legen und sehen, wann Melder auslösen, was die Zentrale tut und wann die Feuerwehr kommt.</li>
        <li><a href="protokolle/gefaehrdungsbeurteilung.html">Gefährdungsbeurteilung</a> – Gefährdungsbeurteilung nach § 5 ArbSchG: Gefährdungen aus dem Katalog der 11 Faktoren oder Vorlagen, Risiko vor und nach den Maßnahmen, Maßnahmen nach STOP mit Verantwortlichen und Terminen, Wirksamkeit, Risikomatrix und PDF.</li>
      </ul>
    </section>

    function karte(e) {

      a.append(h, p, w);
      return a;
    }

      const ziel = document.getElementById('liste');

        // Untergruppen, falls vorhanden; sonst ein Raster

          if (gr && gruppen.length > 1) {
            const t = document.createElement('div'); t.className = 'gruppe-titel'; t.textContent = gr;

          }

          liste.filter(function (e) { return (e.gruppe || '') === gr; }).forEach(function (e) { raster.append(karte(e)); });
